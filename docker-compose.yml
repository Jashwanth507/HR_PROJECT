version: '3.8'

services:
  recruitment-portal:
    build: .
    container_name: recruitment-portal
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/database.db
